<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Court — Weekly Pickleball Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="header">
  <div class="wrap">
    <p class="eyebrow">Weekly Availability</p>
    <h1>OPEN COURT</h1>
    <p class="sub">Tap the slots you can play. Everyone on the board sees it update — first to fill a row gets to call next.</p>
  </div>
</div>

<div class="wrap">
  <div class="who-bar" id="whoBar"></div>

  <div class="legend" id="legend"></div>

  <div class="board">
    <table id="board">
      <thead>
        <tr id="headRow"><th style="background:var(--court-dark)"></th></tr>
      </thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>

  <footer>Board updates live for everyone with the link.</footer>
</div>

<script src="/app.js"></script>
</body>
</html>
